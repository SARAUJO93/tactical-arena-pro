name: Release — Tactical Arena

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan for exposed secrets
        run: npm run check:secrets

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate release
        run: |
          npm run check:release
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Package single-file build
        run: |
          npm run release:notes
          npm run package:release
          cd release
          tar -czf tactical-arena-${GITHUB_REF_NAME}.tar.gz \
            tactical-arena-${GITHUB_REF_NAME}.html \
            README.md TIKFINITY.md CHANGELOG.md LICENSE.md manifest.json
          sha256sum tactical-arena-${GITHUB_REF_NAME}.html \
            tactical-arena-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS.txt

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            release/

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE_NOTES.md
          files: |
            release/tactical-arena-${{ github.ref_name }}.html
            release/tactical-arena-${{ github.ref_name }}.tar.gz
            release/SHA256SUMS.txt
            release/manifest.json
