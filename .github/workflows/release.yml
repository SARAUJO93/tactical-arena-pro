name: Release — Tactical Arena

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/SARAUJO93/tactical-arena-pro/releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate release
        run: |
          npm run check:release
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Package single-file build
        run: |
          npm run release:notes
          npm run package:release
          cd release
          tar -czf tactical-arena-${GITHUB_REF_NAME}.tar.gz \
            tactical-arena-${GITHUB_REF_NAME}.html \
            README.md TIKFINITY.md CHANGELOG.md LICENSE.md manifest.json
          sha256sum tactical-arena-${GITHUB_REF_NAME}.html \
            tactical-arena-${GITHUB_REF_NAME}.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE_NOTES.md
          files: |
            release/tactical-arena-${{ github.ref_name }}.html
            release/tactical-arena-${{ github.ref_name }}.tar.gz
            release/SHA256SUMS.txt
            release/manifest.json
